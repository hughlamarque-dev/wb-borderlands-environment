<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Borderland maps · Private access</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:#152b35;background:#eef2f0}body{display:grid;place-items:center}#access{width:min(440px,calc(100% - 40px));padding:38px;background:#fff;border:1px solid #d6e0db;border-radius:18px;box-shadow:0 18px 70px #102f3820}.eyebrow{color:#477268;font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:bold}h1{font-size:29px;line-height:1.15;margin:14px 0}p{font-size:14px;line-height:1.55;color:#54666c}label{display:block;font-size:12px;font-weight:bold;margin:25px 0 8px}input{width:100%;padding:13px;font-size:15px;border:1px solid #aebfb9;border-radius:8px}button{background:#123b36;color:white;border:0;border-radius:8px;padding:13px 18px;font-size:14px;font-weight:bold;cursor:pointer}form button{width:100%;margin-top:12px}button:disabled{opacity:.6;cursor:wait}#message{min-height:22px;font-size:13px;color:#a93434}#workspace{position:fixed;inset:0;display:none;background:#eef2f0}#toolbar{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#102f31;color:#fff;gap:10px;font-size:12px}#toolbar nav{display:flex;gap:14px}#toolbar a{color:white;text-decoration:none;font-weight:bold}#lock{padding:6px 11px;background:#ffffff20;font-size:11px}iframe{width:100%;height:calc(100% - 45px);border:0;display:block;background:#eef2f0}#status{position:fixed;left:50%;top:55px;transform:translateX(-50%);z-index:10000;background:#fff;color:#173d39;box-shadow:0 4px 20px #0003;border-radius:9px;padding:10px 18px;font-size:13px;display:none}a:focus-visible,button:focus-visible{outline:3px solid #e6ad45;outline-offset:3px}
@media(max-width:620px){#routeLabel{display:none}#toolbar{height:52px;padding:0 10px}#toolbar nav{gap:8px}#toolbar a{display:flex;align-items:center;min-height:44px;padding:0 8px}#lock{min-height:40px;padding:8px 12px}iframe{height:calc(100% - 52px)}#access{padding:25px;width:calc(100% - 30px)}input{font-size:16px}#status{top:60px;max-width:85%;font-size:12px}}
</style></head><body>
<main id="access"><div class="eyebrow">Private access</div><h1>Borderland maps</h1><p>Enter your access password to open the maps and analysis.</p><form id="unlock"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required spellcheck="false"><button id="unlockButton" type="submit">Open maps</button><p id="message" role="status" aria-live="polite"></p></form></main>
<main id="workspace"><header id="toolbar"><nav><a href="#home" onclick="WBVault.go('home');return false">All maps</a><a href="#analysis" onclick="WBVault.go('analysis');return false">Analysis</a></nav><span id="routeLabel"></span><button id="lock" type="button">Lock</button></header><iframe id="view" title="Borderland map workspace" referrerpolicy="no-referrer"></iframe></main><div id="status" role="status" aria-live="polite"></div>
<script src="shell.js"></script></body></html>
